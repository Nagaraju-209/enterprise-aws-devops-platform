name: Spring Boot CI/CD

on:
  push:
    branches:
      - feature/github-actions-cicd
      - feature/application-load-balancer

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/springboot-app

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Source
        uses: actions/checkout@v4


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # MAVEN BUILD
      # ============================================================

      - name: Grant Execute Permission
        run: chmod +x mvnw

      - name: Build Spring Boot
        run: ./mvnw clean package -DskipTests


      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: app/springboot-app/target/*.jar


      # ============================================================
      # AWS
      # ============================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ============================================================
      # ECR LOGIN
      # ============================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # IMAGE VERSIONING
      # ============================================================

      - name: Generate Image Tags
        id: vars
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "BUILD_TAG=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV


      # ============================================================
      # DOCKER BUILDX
      # ============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ============================================================
      # BUILD + PUSH
      # ============================================================

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: app/springboot-app
          file: app/springboot-app/Dockerfile
          push: true

          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.BUILD_TAG }}
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ============================================================
      # SSH CLIENT
      # ============================================================

      - name: Install SSH Client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client


      # ============================================================
      # SSH CONFIGURATION
      # ============================================================

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/id_rsa << 'EOF'
          ${{ secrets.EC2_SSH_KEY }}
          EOF

          chmod 600 ~/.ssh/id_rsa

          test -s ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts


      # ============================================================
      # DEPLOY TO EC2
      # ============================================================

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF

          set -e

          echo "======================================"
          echo "Starting Deployment"
          echo "======================================"

          echo ""
          echo "========== ECR LOGIN =========="

          aws ecr get-login-password \
            --region ${{ secrets.AWS_REGION }} | \
          docker login \
            --username AWS \
            --password-stdin ${{ secrets.ECR_REGISTRY }}

          echo ""
          echo "========== PULLING IMAGE =========="

          docker pull \
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

          echo ""
          echo "========== STOPPING OLD CONTAINER =========="

          docker stop enterprise-app || true

          echo ""
          echo "========== REMOVING OLD CONTAINER =========="

          docker rm enterprise-app || true

          echo ""
          echo "========== STARTING NEW CONTAINER =========="

          docker run -d \
            --name enterprise-app \
            --restart unless-stopped \
            -p 8083:8083 \
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

          echo ""
          echo "========== RUNNING CONTAINERS =========="

          docker ps

          echo ""
          echo "========== WAITING FOR APPLICATION =========="

          for i in {1..12}; do

            if curl -fsS http://localhost:8083/health; then
              echo ""
              echo "Application is healthy."
              break
            fi

            echo "Waiting for application... Attempt \$i/12"

            sleep 5

            if [ \$i -eq 12 ]; then
              echo ""
              echo "Application failed health check."
              docker logs enterprise-app
              exit 1
            fi

          done

          echo ""
          echo "========== DEPLOYMENT INFORMATION =========="

          hostname
          date

          echo ""
          docker ps

          echo ""
          docker images | head -5

          echo ""
          echo "Deployment to EC2 completed successfully."

          echo ""
          echo "========== DOCKER CLEANUP =========="

          docker container prune -f
          docker image prune -f
          docker builder prune -f

          echo ""
          echo "========== DOCKER DISK USAGE =========="

          docker system df

          echo ""
          echo "========== FILESYSTEM USAGE =========="

          df -h

          EOF


      # ============================================================
      # ALB VALIDATION
      # ============================================================

      - name: Validate Application Through ALB
        shell: bash
        run: |

          echo "======================================"
          echo "Validating Application Through ALB"
          echo "======================================"

          ALB_URL="http://${{ secrets.ALB_DNS_NAME }}/health"

          echo "ALB Health URL:"
          echo "$ALB_URL"

          for i in {1..12}; do

            echo ""
            echo "ALB health check attempt $i/12"

            if curl -fsS --max-time 10 "$ALB_URL"; then

              echo ""
              echo "======================================"
              echo "ALB HEALTH CHECK PASSED"
              echo "======================================"

              exit 0
            fi

            echo "ALB target is not ready yet."
            echo "Waiting 10 seconds..."

            sleep 10

          done

          echo ""
          echo "======================================"
          echo "ALB HEALTH CHECK FAILED"
          echo "======================================"

          exit 1


      # ============================================================
      # WORKFLOW SUMMARY
      # ============================================================

      - name: Generate Workflow Summary
        run: |
          {
          echo "# 🚀 Enterprise AWS DevOps Platform Deployment"
          echo ""
          echo "## Deployment Status"
          echo "✅ Success"
          echo ""
          echo "## Repository"
          echo "${{ github.repository }}"
          echo ""
          echo "## Branch"
          echo "${{ github.ref_name }}"
          echo ""
          echo "## Commit SHA"
          echo "${{ env.SHORT_SHA }}"
          echo ""
          echo "## Build Number"
          echo "${{ github.run_number }}"
          echo ""
          echo "## Docker Image Tags"
          echo "- latest"
          echo "- build-${{ github.run_number }}"
          echo "- ${{ env.SHORT_SHA }}"
          echo ""
          echo "## AWS Region"
          echo "${{ secrets.AWS_REGION }}"
          echo ""
          echo "## Deployment Target"
          echo "Amazon EC2"
          echo ""
          echo "## Load Balancer"
          echo "Application Load Balancer"
          echo ""
          echo "## Container"
          echo "enterprise-app"
          echo ""
          echo "## Application Port"
          echo "8083"
          echo ""
          echo "## ALB Listener"
          echo "HTTP :80"
          echo ""
          echo "## ALB Target Port"
          echo "8083"
          echo ""
          echo "## Deployment Time (UTC)"
          date -u
          } >> $GITHUB_STEP_SUMMARY