name: Spring Boot CI/CD

on:
  push:
    branches:
      - main
      - feature/github-actions-cicd
      - feature/application-load-balancer
      - feature/cloudwatch-monitoring

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/springboot-app

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Source
        uses: actions/checkout@v4


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # MAVEN BUILD
      # ============================================================

      - name: Grant Execute Permission
        run: chmod +x mvnw

      - name: Build Spring Boot
        run: ./mvnw clean package -DskipTests


      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: app/springboot-app/target/*.jar


      # ============================================================
      # AWS
      # ============================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ============================================================
      # ECR LOGIN
      # ============================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # IMAGE VERSIONING
      # ============================================================

      - name: Generate Image Tags
        id: vars
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "BUILD_TAG=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV


      # ============================================================
      # DOCKER BUILDX
      # ============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ============================================================
      # BUILD + PUSH
      # ============================================================

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: app/springboot-app
          file: app/springboot-app/Dockerfile
          push: true

          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.BUILD_TAG }}
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ============================================================
      # DEPLOY TO EC2 USING AWS SYSTEMS MANAGER
      # ============================================================

      - name: Deploy to EC2 via SSM
        shell: bash
        run: |

          echo "======================================"
          echo "Starting SSM Deployment"
          echo "======================================"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo === ECR LOGIN ===",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "echo === PULLING IMAGE ===",
              "docker pull ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}",
              "echo === STOPPING OLD CONTAINER ===",
              "docker stop enterprise-app || true",
              "echo === REMOVING OLD CONTAINER ===",
              "docker rm enterprise-app || true",
              "echo === STARTING NEW CONTAINER ===",
              "docker run -d --name enterprise-app --restart unless-stopped -p 8083:8083 ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}",
              "echo === CONTAINER STATUS ===",
              "docker ps",
              "echo === APPLICATION HEALTH CHECK ===",
              "for i in $(seq 1 12); do if curl -fsS http://localhost:8083/health; then echo Application is healthy.; exit 0; fi; echo Waiting for application... Attempt $i/12; sleep 5; done",
              "echo Application failed health check.",
              "docker logs enterprise-app",
              "exit 1"
            ]' \
            --region "${{ secrets.AWS_REGION }}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "======================================"
          echo "Waiting for SSM deployment"
          echo "======================================"

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region "${{ secrets.AWS_REGION }}" \
              --query 'Status' \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                echo "======================================"
                echo "SSM DEPLOYMENT SUCCESSFUL"
                echo "======================================"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                  --region "${{ secrets.AWS_REGION }}" \
                  --query 'StandardOutputContent' \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Undeliverable)
                echo "======================================"
                echo "SSM DEPLOYMENT FAILED"
                echo "======================================"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                  --region "${{ secrets.AWS_REGION }}" \
                  --query '[StatusDetails,StandardOutputContent,StandardErrorContent]' \
                  --output text

                exit 1
                ;;
            esac

            sleep 5

          done

          echo "SSM deployment timed out."
          exit 1


      # ============================================================
      # ALB VALIDATION
      # ============================================================

      - name: Validate Application Through ALB
        shell: bash
        run: |

          echo "======================================"
          echo "Validating Application Through ALB"
          echo "======================================"

          ALB_URL="http://${{ secrets.ALB_DNS_NAME }}/health"

          echo "ALB Health URL:"
          echo "$ALB_URL"

          for i in {1..12}; do

            echo ""
            echo "ALB health check attempt $i/12"

            if curl -fsS --max-time 10 "$ALB_URL"; then

              echo ""
              echo "======================================"
              echo "ALB HEALTH CHECK PASSED"
              echo "======================================"

              exit 0
            fi

            echo "ALB target is not ready yet."
            echo "Waiting 10 seconds..."

            sleep 10

          done

          echo ""
          echo "======================================"
          echo "ALB HEALTH CHECK FAILED"
          echo "======================================"

          exit 1


      # ============================================================
      # WORKFLOW SUMMARY
      # ============================================================

      - name: Generate Workflow Summary
        run: |
          {
          echo "# 🚀 Enterprise AWS DevOps Platform Deployment"
          echo ""
          echo "## Deployment Status"
          echo "✅ Success"
          echo ""
          echo "## Repository"
          echo "${{ github.repository }}"
          echo ""
          echo "## Branch"
          echo "${{ github.ref_name }}"
          echo ""
          echo "## Commit SHA"
          echo "${{ env.SHORT_SHA }}"
          echo ""
          echo "## Build Number"
          echo "${{ github.run_number }}"
          echo ""
          echo "## Docker Image Tags"
          echo "- latest"
          echo "- build-${{ github.run_number }}"
          echo "- ${{ env.SHORT_SHA }}"
          echo ""
          echo "## AWS Region"
          echo "${{ secrets.AWS_REGION }}"
          echo ""
          echo "## Deployment Target"
          echo "Amazon EC2"
          echo ""
          echo "## Load Balancer"
          echo "Application Load Balancer"
          echo ""
          echo "## Container"
          echo "enterprise-app"
          echo ""
          echo "## Application Port"
          echo "8083"
          echo ""
          echo "## ALB Listener"
          echo "HTTP :80"
          echo ""
          echo "## ALB Target Port"
          echo "8083"
          echo ""
          echo "## Deployment Time (UTC)"
          date -u
          } >> $GITHUB_STEP_SUMMARY