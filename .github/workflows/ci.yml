


name: Spring Boot CI/CD

on:
  push:
    branches:
      - feature/github-actions-cicd

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/springboot-app

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Execute Permission
        run: chmod +x mvnw

      - name: Build Spring Boot
        run: ./mvnw clean package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: app/springboot-app/target/*.jar

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Image Tags
        id: vars
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "BUILD_TAG=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: app/springboot-app
          file: app/springboot-app/Dockerfile
          push: true

          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.BUILD_TAG }}
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install SSH Client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/id_rsa << 'EOF'
          ${{ secrets.EC2_SSH_KEY }}
          EOF

          chmod 600 ~/.ssh/id_rsa

          echo "Checking private key..."
          head -n 2 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF

          set -e

          echo "======================================"
          echo "Starting Deployment"
          echo "======================================"

          echo "Logging into Amazon ECR..."
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

          echo "Pulling latest image..."
          docker pull ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

          echo "Stopping existing container..."
          docker stop enterprise-app || true

          echo "Removing existing container..."
          docker rm enterprise-app || true

          echo "Starting new container..."
          docker run -d \
            --name enterprise-app \
            --restart unless-stopped \
            -p 8083:8083 \
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

          echo ""
          echo "========== Running Containers =========="
          docker ps

          echo ""
          echo "========== Available Images =========="
          docker images | head -5

          echo ""
          echo "========== Waiting for Application =========="

          for i in {1..10}; do

            if curl -f http://${{ secrets.EC2_HOST }}:8083/health; then
              echo ""
              echo "Application is healthy."
              break
            fi

            echo "Waiting... Attempt \$i/10"  
            sleep 5

            if [ \$i -eq 10 ]; then
              echo ""
              echo "Application failed health check."
              exit 1
            fi

          done

          echo ""
          echo "========== Deployment Information =========="
          hostname
          date

          echo ""
          docker ps

          echo ""
          docker images | head -5

          echo ""
          echo "Deployment completed successfully."

          echo "Application deployed successfully."

          echo "Cleaning up unused Docker resources..."

          docker container prune -f

          docker image prune -f

          docker builder prune -f

          echo "Docker disk usage:"

          docker system df

          echo "Filesystem usage:"

          df -h

          EOF

      - name: Generate Workflow Summary
        run: |
          {
          echo "# 🚀 Enterprise AWS DevOps Platform Deployment"
          echo ""
          echo "## Deployment Status"
          echo "✅ Success"
          echo ""
          echo "## Repository"
          echo "${{ github.repository }}"
          echo ""
          echo "## Branch"
          echo "${{ github.ref_name }}"
          echo ""
          echo "## Commit SHA"
          echo "${{ env.SHORT_SHA }}"
          echo ""
          echo "## Build Number"
          echo "${{ github.run_number }}"
          echo ""
          echo "## Docker Image Tags"
          echo "- latest"
          echo "- build-${{ github.run_number }}"
          echo "- ${{ env.SHORT_SHA }}"
          echo ""
          echo "## AWS Region"
          echo "${{ secrets.AWS_REGION }}"
          echo ""
          echo "## Deployment Target"
          echo "Amazon EC2"
          echo ""
          echo "## Container"
          echo "enterprise-app"
          echo ""
          echo "## Application Port"
          echo "8083"
          echo ""
          echo "## Deployment Time (UTC)"
          date -u
          } >> $GITHUB_STEP_SUMMARY